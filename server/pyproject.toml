[project]
name = "aigm"
version = "0.1.0"
description = "Add your description here"
authors = [
    { email = "sommda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "d20>=1.1.2",
    "fastapi>=0.143.2",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aigm = "aigm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:lark.*"]
